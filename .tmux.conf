# Remap prefix to C-a
set -g prefix 'C-a'

# open windows in same directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g mouse on

# in copy mode send selection to xclip
unbind -T copy-mode MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

set -g repeat-time 100

set -g history-limit 10000
set -g allow-rename off

bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"

set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g renumber-windows on
set -g detach-on-destroy off
set -g terminal-overrides 'xterm*:colors=256'
set-option -g default-terminal "tmux-256color"


set-option -g focus-events on
set-option -a terminal-features 'alacritty:RGB'
set-option -g status on
set-option -g status-interval 1
set-option -g status-justify centre
set-option -g status-keys vi
set-option -g status-position bottom
set-option -g status-style fg=colour136,bg=colour235

set-option -g status-left-length 20
set-option -g status-left-style default
set-option -g status-left "#[fg=green,bright]#(whoami)#[default]: #[fg=yellow]#S#[default]"

set-option -g status-right ""

set -g @resurrect-dir '~/.tmux/resurrect'
#set -g @continuum-restore 'on'
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
